name: Deploy to AWS Lightsail

on:
  push:
    branches: [ main, improve-app-migrate-aws-claude ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Frontend
      - name: 🏗️ Build frontend
        working-directory: my-apps/client
        env:
          CI: "false"
        run: |
          set -eux
          npm ci
          # ปิด postbuild ที่เรียก sw-precache (ถ้ามี)
          npm pkg delete scripts.postbuild || true
          # ถ้าบางโปรเจ็กต์ใช้ predeploy/deploy เก่าๆ ก็ลบทิ้งด้วย
          npm pkg delete scripts.predeploy || true
          npm pkg delete scripts.deploy || true
          # build
          REACT_APP_API_URL=/api npm run build

      # Backend
      - name: Prepare backend
        working-directory: server/api
        run: |
          set -eux
          npm ci --omit=dev

      # Package
      - name: Create packages
        run: |
          set -eux
          tar -czf backend.tar.gz server/
          cd my-apps/client
          tar -czf frontend.tar.gz build/
          mv frontend.tar.gz ../../

      # Upload files (no heredoc)
      - name: Upload backend package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend.tar.gz"
          target: "/tmp/"

      - name: Upload frontend package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend.tar.gz"
          target: "/tmp/"

      # Remote commands
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/sigma /var/www/sigma
            if [ -d /opt/sigma/server ]; then
              sudo tar -czf "/tmp/backup-$(date +%Y%m%d-%H%M%S).tar.gz" -C /opt/sigma server/
            fi
            sudo tar -xzf /tmp/backend.tar.gz -C /opt/sigma/
            sudo chown -R sigma:sigma /opt/sigma/
            if [ -f /etc/sigma/env ]; then . /etc/sigma/env; fi
            cd /opt/sigma/server/api
            sudo -u sigma npm ci --omit=dev
            if sudo -u sigma pm2 list | grep -q sigma-api; then
              sudo -u sigma pm2 restart sigma-api
            else
              sudo -u sigma pm2 start app.js --name sigma-api --time
              sudo -u sigma pm2 save
            fi
            sudo tar -xzf /tmp/frontend.tar.gz -C /var/www/sigma/ --strip-components=1
            sudo chown -R www-data:www-data /var/www/sigma/
            sudo nginx -t && sudo systemctl reload nginx
            rm -f /tmp/backend.tar.gz /tmp/frontend.tar.gz
            echo "✅ Deployment complete"

      - name: Cleanup local
        if: always()
        run: rm -f backend.tar.gz frontend.tar.gz
