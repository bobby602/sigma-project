name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🏗️ Build Frontend
        working-directory: ./my-apps/client
        run: |
          npm ci
          REACT_APP_API_URL=/api npm run build

      - name: 📦 Prepare Backend
        working-directory: ./server/api
        run: |
          npm ci --production

      - name: 📦 Create packages
        run: |
          tar -czf backend.tar.gz server/
          cd my-apps/client && tar -czf frontend.tar.gz build/ && mv frontend.tar.gz ../../

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Server
        run: |
          scp -i ~/.ssh/deploy_key backend.tar.gz deploy@${{ secrets.SERVER_HOST }}:/tmp/
          scp -i ~/.ssh/deploy_key frontend.tar.gz deploy@${{ secrets.SERVER_HOST }}:/tmp/
          
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            # Backup
            [ -d /opt/sigma/server ] && sudo tar -czf /tmp/backup-$(date +%Y%m%d-%H%M%S).tar.gz -C /opt/sigma server/ 2>/dev/null || true
            
            # Deploy backend
            sudo tar -xzf /tmp/backend.tar.gz -C /opt/sigma/
            sudo chown -R sigma:sigma /opt/sigma/
            cd /opt/sigma/server/api
            source /etc/sigma/env
            sudo -u sigma npm install --production
            
            # Restart API
            if sudo -u sigma pm2 list | grep -q sigma-api; then
              sudo -u sigma pm2 restart sigma-api
            else
              sudo -u sigma pm2 start app.js --name sigma-api --time
              sudo -u sigma pm2 save
            fi
            
            # Deploy frontend
            sudo tar -xzf /tmp/frontend.tar.gz -C /var/www/sigma/ --strip-components=1
            sudo chown -R www-data:www-data /var/www/sigma/
            sudo systemctl reload nginx
            
            # Cleanup
            rm -f /tmp/*.tar.gz
            
            echo "✅ Deployment complete!"
            sudo -u sigma pm2 status
ENDSSH

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key *.tar.gz